<style>

*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(1100px 600px at 50% -200px,rgba(42,92,170,.16),transparent 60%),var(--ink);color:var(--txt);font-family:var(--font-b);font-size:15px;line-height:1.7;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;-webkit-font-smoothing:antialiased}
::selection{background:rgba(201,162,39,.32);color:#fff}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px;border-radius:6px}
.wrap{width:min(430px,100%)}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:26px;text-decoration:none}

.brand .bt b{display:block;font-family:var(--font-d);font-weight:400;font-size:18px;letter-spacing:.08em;color:var(--txt);line-height:1.2}

h1{font-family:var(--font-b);font-size:25px;font-weight:600;letter-spacing:0}
h1 i{font-style:normal;color:var(--gold-hi)}
.sub{color:var(--txt-3);font-size:13px;margin-bottom:22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;color:var(--txt-2);margin-bottom:7px;letter-spacing:.04em}
.row{display:flex;gap:10px}
.row input{flex:1;min-width:0}
input{width:100%;background:rgba(7,13,24,.55);border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;color:var(--txt);font-size:14.5px;font-family:var(--font-b);transition:border-color .25s,box-shadow .25s}
input::placeholder{color:#4a586e}
input:focus{outline:none;border-color:rgba(233,196,85,.55);box-shadow:0 0 0 3px rgba(201,162,39,.12)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 18px;font-size:14px;letter-spacing:.04em;cursor:pointer;transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s,background .3s,color .3s,border-color .3s;border:1px solid transparent}
.btn-code{background:none;border:1px solid rgba(233,196,85,.45);color:var(--gold-hi);white-space:nowrap;min-width:118px}

.btn-go{width:100%;background:linear-gradient(160deg,#3568b3,#2a5caa);color:#fff;font-size:15px;padding:13px;box-shadow:0 10px 30px rgba(42,92,170,.35),inset 0 1px 0 rgba(255,255,255,.18);margin-top:8px}
.btn-go:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 40px rgba(42,92,170,.45)}
.btn-go:disabled{opacity:.6;cursor:wait}
.link-back{display:inline-flex;align-items:center;min-height:36px;margin-top:10px;background:none;border:none;color:var(--txt-3);font:inherit;font-size:13px;cursor:pointer;text-underline-offset:4px}
.link-back:hover{color:var(--gold-hi)}
.msg{min-height:22px;margin-top:14px;font-size:12.5px;display:flex;align-items:center;gap:7px;opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s}
.msg.show{opacity:1;transform:none}
.msg.err{color:#f85149}.msg.ok{color:var(--ac)}
.ft{margin-top:22px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px}

.password-field{position:relative}.password-field:has(.password-toggle:not([hidden])) input{padding-right:64px}
.password-toggle{position:absolute;right:4px;top:3px;min-height:44px;min-width:52px;border:0;border-radius:8px;background:none;color:var(--txt-2);font:inherit;font-size:13px;cursor:pointer}
.password-toggle:hover{color:var(--gold-hi);background:rgba(198,216,240,.06)}
.password-toggle[hidden]{display:none}
.field-hint{font-size:12px;line-height:1.7;color:var(--txt-3);margin-top:8px}
input[aria-invalid="true"]{border-color:#ff8d87}
[hidden]{display:none!important}
.oauth-row{display:flex;align-items:center;gap:12px;margin-top:20px;color:var(--txt-3);font-size:12px}
.oauth-row::before,.oauth-row::after{content:"";flex:1;height:1px;background:var(--line-strong)}
.oauth-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.btn-oauth{width:100%;background:rgba(7,13,24,.55);color:var(--txt);font-size:14px;letter-spacing:0;padding:12px;gap:10px}
.btn-oauth:hover:not(:disabled){background:rgba(42,92,170,.25);border-color:rgba(42,92,170,.5)}
.btn-oauth svg{width:18px;height:18px;flex-shrink:0;fill:currentColor}
.native-login{display:block;margin-top:18px;color:var(--txt-2);font-size:14px;line-height:1.8}
.native-login a{display:inline-flex;align-items:center;min-height:44px;color:var(--gold-hi);text-underline-offset:4px}
.noscript-hint{color:var(--gold-hi);margin-top:16px;font-size:13px}
.noscript-hint a{color:var(--gold-hi);text-underline-offset:4px}
.admin-note{font-size:12px;color:var(--txt-3);margin-bottom:14px;padding:8px 12px;border-radius:8px;background:rgba(42,92,170,.12);border:1px solid rgba(42,92,170,.25)}

/* 内嵌模式：作为登录弹层承载页时只保留卡片本体 */
body.embed{padding:18px 14px;min-height:100svh}

.embed-close:hover{color:var(--txt);border-color:rgba(233,196,85,.45)}
body.embed .embed-close{display:flex}
@media(max-width:420px){.card{padding:26px 22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

@media(max-width:720px){body{padding:24px 16px;justify-content:flex-start}.wrap{max-width:460px}.card{padding:26px 24px}}
@media(max-width:360px){body{padding-inline:12px}.card{padding-inline:18px}.row{gap:8px}.btn-code{min-width:108px;padding-inline:8px}input{padding-inline:10px}}

      <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="url(#g)" stroke="#c9a227" stroke-opacity=".8" stroke-width="1.6"/>

      <path d="M44 21 L52.5 32 L44 43" fill="none" stroke="#e8edf5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24.5 43 L32.5 26.5 L36.8 32.8 L39.6 28.6 L46 43 Z" fill="#e8edf5"/>

  <main class="card">

    <div class="pane on" id="pane-flow" aria-label="邮箱验证码登录">

    <!-- ====== 管理员 break-glass：仅 PRIV_EDIT_SYSTEM 可见（boot.canPwd + ?tab=pwd）====== -->

    <div class="oauth-row" aria-hidden="true">或使用以下方式登录</div>

    <div class="ft">
      <span id="ft-admin-links" hidden><a id="ft-pwd" href="/reg?tab=pwd">密码登录</a>&nbsp;·&nbsp;<a href="/lostpass" target="_top">找回密码</a></span>

<script>
'use strict';
(function(){
  var $=function(id){return document.getElementById(id)};
  // Match the server's localRedirect policy for query strings and API responses.
  function localPath(value,fallback){
    if(typeof value!=='string'||value.charAt(0)!=='/'||value.slice(0,2)==='//'||/[\\\s\u0000-\u001f\u007f]/.test(value))return fallback;
    try{if(new URL(value,location.origin).origin!==location.origin)return fallback}catch(e){return fallback}
    return value;
  }
  var RETURN=localPath(new URLSearchParams(location.search).get('return'),'');
  if(RETURN&&/^\/(?:login|reg|register|logout)\/?$/.test(new URL(RETURN,location.origin).pathname))RETURN='';
  /* 内嵌模式（登录弹层的同源 iframe）：成功/关闭通过 postMessage 交给宿主页处理 */
  var EMBED=(function(){try{return (window.__SWPU_BOOT&&window.__SWPU_BOOT.embed)||window.self!==window.top}catch(e){return false}})();
  function finish(returnTo){
    returnTo=localPath(returnTo,'/');
    if(EMBED){try{parent.postMessage({type:'swpu-auth-success',return:returnTo},location.origin)}catch(e){}return}
    location.href=returnTo;
  }
  if(EMBED){
    document.body.className+=' embed';
    var eclose=document.createElement('button');
    eclose.type='button';eclose.className='embed-close';eclose.textContent='✕';
    eclose.setAttribute('aria-label','关闭登录窗口');eclose.title='关闭 (Esc)';
    eclose.addEventListener('click',function(){try{parent.postMessage({type:'swpu-auth-close'},location.origin)}catch(e){}});
    document.body.appendChild(eclose);
    document.querySelectorAll('a[href]').forEach(function(a){
      var href=a.getAttribute('href')||'';
      if(href.charAt(0)==='/'&&href.charAt(1)!=='/')a.target='_top';
    });
  }
  function msg(el,text,cls){el.textContent=text;el.className='msg show '+cls}
  function hide(el){el.textContent='';el.className='msg'}
  function invalid(id,text){var input=$(id);input.setAttribute('aria-invalid','true');msg($('m-msg'),text,'err');input.focus()}
  document.querySelectorAll('input').forEach(function(input){input.addEventListener('input',function(){input.removeAttribute('aria-invalid')})});
  document.querySelectorAll('.codein').forEach(function(input){input.addEventListener('input',function(){input.value=input.value.replace(/[^0-9]/g,'').slice(0,6)})});
  function validMail(mail){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)}
  async function api(url,data){
    var controller=new AbortController(),timeout=setTimeout(function(){controller.abort()},15000);
    try{
      var body=new URLSearchParams(data);
      body.set('csrf',(window.__SWPU_BOOT&&window.__SWPU_BOOT.csrf)||'');
      var response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body,signal:controller.signal});
      var d;
      try{d=await response.json()}catch(e){
        if(e.name==='AbortError')throw e;
        return {ok:false,message:'服务暂时不可用，请稍后重试。'};
      }
      if(!d||typeof d!=='object'||typeof d.ok!=='boolean')return {ok:false,message:'服务返回异常，请稍后重试。'};
      if(!response.ok)return {ok:false,message:typeof d.message==='string'?d.message:'请求失败（'+response.status+'），请稍后重试。'};
      return d;
    }catch(e){
      return {ok:false,message:e.name==='AbortError'?'请求超时，请稍后重试；若已收到验证码，可直接填写。':'网络连接失败，请检查网络后重试。'};
    }finally{clearTimeout(timeout)}
  }

  /* ====== 单一验证码流：state1=邮箱 → state2=码(+用户名 if 新) ====== */
  var FLOW={step:1,registered:null,mail:'',timer:null};
  var mNext=$('m-next'),mGo=$('m-go'),mSend=$('m-send'),mBack=$('m-back');
  function flowTitle(){
    var suffix=$('flow-title-suffix');
    suffix.textContent=FLOW.registered===false?' / 注册':'';
  }
  function showStep2(){
    FLOW.step=2;
    $('m-code-field').hidden=false;
    $('m-uname-field').hidden=!!FLOW.registered;
    mGo.hidden=false;mGo.textContent=FLOW.registered?'登录':'创建账号，开始登顶';
    mNext.hidden=true;mBack.hidden=false;mSend.hidden=false;
    flowTitle();
    $('m-code').focus();
  }
  function backToStep1(){
    FLOW.step=1;FLOW.registered=null;
    $('m-code-field').hidden=true;$('m-uname-field').hidden=true;
    mGo.hidden=true;mBack.hidden=true;mSend.hidden=true;
    mNext.hidden=false;mNext.textContent='获取验证码';mNext.disabled=false;
    flowTitle();
  }
  mNext.addEventListener('click',async function(){
    if(mNext.disabled)return;
    var mail=$('m-mail').value.trim();
    if(!validMail(mail)){invalid('m-mail','请填写完整的邮箱地址，例如 you@example.com。');return}
    $('m-mail').removeAttribute('aria-invalid');
    FLOW.mail=mail;
    mNext.disabled=true;mNext.textContent='发送中…';hide($('m-msg'));
    var d=await api('/reg/code',{mail:mail,purpose:'auto'});
    if(d.ok){
      FLOW.registered=d.registered===true;
      showStep2();
      msg($('m-msg'),d.message||'验证码已发送，请查收邮箱。','ok');
      var until=Date.now()+60000;
      function tick(){
        var seconds=Math.max(0,Math.ceil((until-Date.now())/1000));
        mSend.textContent=seconds?seconds+' 秒后重发':'重新获取';
        if(!seconds){clearInterval(FLOW.timer);mSend.disabled=false}
      }
      clearInterval(FLOW.timer);tick();FLOW.timer=setInterval(tick,1000);mSend.disabled=true;
      if(document.activeElement===mNext)$('m-code').focus();
    }else{msg($('m-msg'),d.message||'发送失败，请稍后重试。','err');mNext.disabled=false;mNext.textContent='获取验证码'}
  });
  mSend.addEventListener('click',async function(){
    if(mSend.disabled)return;
    var mail=$('m-mail').value.trim();
    if(!validMail(mail)){invalid('m-mail','请填写完整的邮箱地址。');return}
    mSend.disabled=true;mSend.textContent='发送中…';hide($('m-msg'));
    var d=await api('/reg/code',{mail:mail,purpose:'auto'});
    if(d.ok){
      FLOW.registered=d.registered===true;
      $('m-uname-field').hidden=!!FLOW.registered;
      mGo.textContent=FLOW.registered?'登录':'创建账号，开始登顶';
      flowTitle();
      msg($('m-msg'),d.message||'验证码已发送，请查收邮箱。','ok');
      var until=Date.now()+60000;
      function tick(){
        var seconds=Math.max(0,Math.ceil((until-Date.now())/1000));
        mSend.textContent=seconds?seconds+' 秒后重发':'重新获取';
        if(!seconds){clearInterval(FLOW.timer);mSend.disabled=false}
      }
      clearInterval(FLOW.timer);tick();FLOW.timer=setInterval(tick,1000);
    }else{msg($('m-msg'),d.message||'发送失败，请稍后重试。','err');mSend.disabled=false;mSend.textContent='重新获取'}
  });
  mBack.addEventListener('click',function(){clearInterval(FLOW.timer);backToStep1()});
  $('f-flow').addEventListener('submit',async function(e){
    e.preventDefault();
    if(mGo.disabled)return;
    var mail=$('m-mail').value.trim(),code=$('m-code').value.trim();
    if(!validMail(mail)){invalid('m-mail','请填写完整的邮箱地址，例如 you@example.com。');return}
    if(!/^\d{6}$/.test(code)){invalid('m-code','请输入邮箱中收到的 6 位数字验证码。');return}
    var data={mail:mail,code:code},url;
    if(FLOW.registered){url='/reg/login'}
    else{
      var uname=$('m-uname').value.trim();
      if(!uname){invalid('m-uname','请设置一个用户名。');return}
      data.uname=uname;
      url='/reg/complete';
    }
    mGo.disabled=true;mGo.textContent=FLOW.registered?'登录中…':'创建中…';
    var d=await api(url,data);
    if(d.ok){
      mGo.textContent=FLOW.registered?'登录成功，正在进入…':'账号已创建，正在进入…';
      msg($('m-msg'),mGo.textContent,'ok');
      finish(RETURN||d.redirect||'/');
    }else{
      msg($('m-msg'),d.message||'操作失败，请稍后重试。','err');
      mGo.disabled=false;mGo.textContent=FLOW.registered?'登录':'创建账号，开始登顶';
    }
  });

  /* ====== 面板切换：默认流 vs 管理员密码面板（boot.canPwd 门控） ====== */
  var panes={flow:$('pane-flow'),pwd:$('pane-pwd')};
  function showPane(which){
    var key=panes[which]?which:'flow';
    Object.keys(panes).forEach(function(k){panes[k].classList.toggle('on',k===key)});
  }
  var BOOT=window.__SWPU_BOOT||{};
  var isPwd=BOOT.canPwd===true&&BOOT.tab==='pwd';
  if(BOOT.canPwd===true){
    $('ft-admin-links').hidden=false;
    $('ft-pwd').addEventListener('click',function(e){e.preventDefault();showPane('pwd');$('p-uname').focus()});
    $('p-back').addEventListener('click',function(){showPane('flow')});
    var nl=$('native-login');if(nl)nl.href='/login?fallback=1&redirect='+encodeURIComponent(RETURN||'/');
  }else{
    /* 学生看不到密码面板与找回密码（无密码语义下无用） */
    $('pwd-note').parentNode&&panes.pwd.remove();
    var ftAdmin=$('ft-admin-links');if(ftAdmin)ftAdmin.remove();
  }
  if(isPwd)showPane('pwd');else showPane('flow');

  /* 第三方登录：服务端从 handler.loginMethods（Hydro oauth 注册表）注入
     __SWPU_BOOT.oauth；未配置/未安装时为空数组，整行自动隐藏。 */
  (function(){
    var list=$('oauth-list');if(!list)return;
    var providers=(window.__SWPU_BOOT&&window.__SWPU_BOOT.oauth)||[];
    function safeIcon(markup){
      var doc,root,nodes,el,attrs,i,j,n,v;
      try{doc=new DOMParser().parseFromString(markup,'image/svg+xml')}catch(e){return null}
      if(!doc||!doc.documentElement||doc.querySelector('parsererror'))return null;
      root=doc.documentElement;
      if(String(root.nodeName).toLowerCase()!=='svg')return null;
      nodes=root.getElementsByTagName('*');
      for(i=nodes.length-1;i>=0;i--){
        el=nodes[i];
        if(/^(script|foreignObject|iframe|object|embed|animate|set)$/i.test(el.nodeName)){
          if(el.parentNode)el.parentNode.removeChild(el);
          continue;
        }
        attrs=Array.prototype.slice.call(el.attributes||[]);
        for(j=0;j<attrs.length;j++){
          n=attrs[j].name;v=attrs[j].value;
          if(/^on/i.test(n)||/^(href|xlink:href|src|action|formaction|style)$/i.test(n)){el.removeAttribute(n);continue}
          if(/javascript:|vbscript:|data:text\/html/i.test(v))el.removeAttribute(n);
        }
      }
      return document.importNode(root,true);
    }
    providers.forEach(function(p){
      if(!p||typeof p.id!=='string'||typeof p.icon!=='string')return;
      var a=document.createElement('a');
      a.href='/oauth/'+encodeURIComponent(p.id)+'/login?redirect='+encodeURIComponent(RETURN||'/');
      a.target='_top';
      a.className='btn btn-oauth';
      var icon=safeIcon(p.icon);
      if(icon)a.appendChild(icon);
      var span=document.createElement('span');
      span.textContent=p.text||('使用 '+p.id+' 登录');
      a.appendChild(span);
      list.appendChild(a);
    });
    if(!list.children.length){if(list.previousElementSibling)list.previousElementSibling.remove();list.remove()}
  })();

  /* ====== 管理员密码登录（Hydro 5.0.7 POST /login 成功时重定向） ====== */
  var pwdForm=$('f-pwd');
  if(pwdForm){
    var pwdGo=$('p-go'),pwdLabel=pwdGo.textContent;
    document.querySelectorAll('.password-toggle').forEach(function(btn){
      btn.hidden=false;
      btn.addEventListener('click',function(){
        var input=$(btn.getAttribute('aria-controls')),show=input.type==='password';
        input.type=show?'text':'password';btn.textContent=show?'隐藏':'显示';
        btn.setAttribute('aria-pressed',String(show));btn.setAttribute('aria-label',show?'隐藏密码':'显示密码');
      });
    });
    pwdForm.addEventListener('submit',async function(e){
      e.preventDefault();
      if(pwdGo.disabled)return;
      var uname=$('p-uname').value.trim(),pw=$('p-pw').value;
      if(!uname){$('p-uname').setAttribute('aria-invalid','true');msg($('p-msg'),'请输入用户名。','err');$('p-uname').focus();return}
      if(!pw){$('p-pw').setAttribute('aria-invalid','true');msg($('p-msg'),'请输入密码。','err');$('p-pw').focus();return}
      var body=new URLSearchParams({uname:uname,password:pw,tfa:'',authnChallenge:'',redirect:RETURN||'/'});
      if($('p-remember').checked)body.set('rememberme','1');
      pwdGo.disabled=true;pwdGo.textContent='登录中…';
      var controller=new AbortController(),timeout=setTimeout(function(){controller.abort()},15000);
      try{
        var resp=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','Accept':'text/html'},body:body.toString(),signal:controller.signal});
        if(resp.ok&&resp.redirected){
          pwdGo.textContent='登录成功，正在进入…';
          msg($('p-msg'),'登录成功，正在进入…','ok');
          finish(RETURN||'/');
        }else{
          var error=resp.status===429?'登录尝试过于频繁，请稍后重试。':
            (resp.status===403||resp.status===401||resp.status===400||resp.status===404)?'登录未完成，请检查账号密码或账号限制。':
            resp.ok?'未能确认登录成功，请重试。':'登录服务暂时不可用，请稍后重试。';
          msg($('p-msg'),error,'err');
          pwdGo.disabled=false;pwdGo.textContent=pwdLabel;
        }
      }catch(err){
        msg($('p-msg'),err.name==='AbortError'?'登录请求超时，请稍后重试。':'网络连接失败，请检查网络后重试。','err');
        pwdGo.disabled=false;pwdGo.textContent=pwdLabel;
      }
      clearTimeout(timeout);
    });
  }
})();
</script>
</body>
</html>
