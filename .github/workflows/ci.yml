name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the scan sees secrets that were later removed.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reject retired domain
        run: |
          if grep -R "swpuacm.bot.cd" --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules .; then
            echo "Found retired domain: swpuacm.bot.cd"
            exit 1
          fi
      - name: Check landing and theme wiring
        run: |
          test -f landing/index.html
          test ! -f landing/reg.html
          test -f plugin-swpu-regcode/reg.html
          grep -q "tab-pwd" plugin-swpu-regcode/reg.html
          grep -q 'action="/login"' plugin-swpu-regcode/reg.html
          grep -q "/reg?tab=pwd" landing/index.html
          test -f theme/00-brand.css
          test ! -f theme/00-native-dark-brand.css
          test -f theme/05-full-dark.css
          test -f deploy/service-worker-killswitch.js
          test -f deploy/set-theme-light.js
          grep -q "og:image" landing/index.html
          grep -q "twitter:card" landing/index.html
          grep -q "theme-btn" landing/index.html
          grep -q "html.dark" landing/index.html
          grep -q "nav__item" landing/index.html
          grep -q "swpu-me" landing/index.html
          grep -q "pageshow" landing/index.html
          grep -q "no-store" landing/index.html
          grep -q "swpu-theme" deploy/update-footer-toggle-sync.js
          grep -q "SWPU ACM brand overlay" theme/00-brand.css
          grep -q "theme--light" theme/00-brand.css
          grep -q "theme--dark" theme/00-brand.css
          grep -q "#panel" theme/00-brand.css
          grep -q "layout--immersive" theme/00-brand.css
          if grep -q ":has(.immersive--content)" theme/00-brand.css; then
            echo "auth styles must be scoped to .layout--immersive, not :has(.immersive--content) — the /contest hero card shares the class and would get white-on-white text"
            exit 1
          fi
          grep -q "swpu-theme-toggle" deploy/set-theme-light.js
          grep -q "05-full-dark.css" theme/README.md
          grep -q "unregister" deploy/service-worker-killswitch.js
          grep -q "service-worker-killswitch" deploy/install-theme.sh
          test -f deploy/deploy.sh
          test -f deploy/smoke.sh
          test -f deploy/patch-ranking-template.sh
          grep -q "SWPU ACM patch: ranking own-row dedup" deploy/patch-ranking-template.sh
          grep -q "ranking own-row dedup" deploy/deployment.md
          grep -q "pm2 restart hydrooj" deploy/deploy.sh
          grep -q "deployment.md" deploy/deploy.sh
      - name: Reject reintroduced injection sinks
        run: |
          # Provider/username data must never be concatenated into markup.
          if grep -nE "innerHTML\s*=\s*(p\.|providers|name)" plugin-swpu-regcode/reg.html landing/index.html; then
            echo "operator- or user-supplied data reached an innerHTML assignment"
            exit 1
          fi
          # A string replacement expands $&, $\`, $' and $$ in the replacement.
          if grep -n "replace(BOOT_MARK, boot" plugin-swpu-regcode/index.ts; then
            echo "the /reg boot payload must use a function replacer, not a string"
            exit 1
          fi
      - name: Check the reverse proxy config parses and stays internally consistent
        run: |
          # check-deployment.sh runs this on the server; CI must not be the only
          # place it is skipped.
          caddy adapt --validate --config deploy/Caddyfile.example > /dev/null
          # The judge service account must stay hidden.
          grep -q "@hidejudge path /user/3" deploy/Caddyfile.example
          # Cloudflare's ranges appear twice: the global trusted_proxies block
          # (access-log client_ip) and the @fromcf matcher (XFF pinning). If they
          # drift, real-IP resolution silently breaks for the differing ranges
          # and nothing else reports it. Both lines must be byte-identical after
          # whitespace normalisation.
          grep -oE '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}/[0-9]{1,2}|[0-9a-f]{1,4}:[0-9a-f:]*:[0-9a-f:]*\/[0-9]{1,3}' deploy/Caddyfile.example > /tmp/cf-all
          test -s /tmp/cf-all
          grep -n 'trusted_proxies static\|@fromcf remote_ip' deploy/Caddyfile.example | cut -d: -f1 > /tmp/cf-lines
          test "$(wc -l < /tmp/cf-lines)" -eq 2 || { echo "expected exactly two Cloudflare range lists"; exit 1; }
          first=$(sed -n "$(head -1 /tmp/cf-lines)p" deploy/Caddyfile.example | tr ' ' '\n' | grep -E '/[0-9]+$' | sort)
          second=$(sed -n "$(tail -1 /tmp/cf-lines)p" deploy/Caddyfile.example | tr ' ' '\n' | grep -E '/[0-9]+$' | sort)
          test -n "$first" || { echo "first Cloudflare list is empty"; exit 1; }
          if [ "$first" != "$second" ]; then
            echo "Cloudflare range lists diverged between the global block and @fromcf:"
            diff <(printf '%s\n' "$first") <(printf '%s\n' "$second") || true
            exit 1
          fi
          echo "both Cloudflare range lists agree ($(printf '%s\n' "$first" | wc -l) ranges)"
      - name: Reject documented-but-unimplemented tuning claims
        run: |
          # The README advertised BBR congestion control, but no sysctl or
          # kernel tuning exists anywhere in the repository. Claims like this
          # are unfalsifiable for a reader and rot silently.
          if grep -niE "\bBBR\b|拥塞控制" README.md deploy/deployment.md; then
            echo "README/deployment.md claims kernel congestion tuning that this repository does not configure"
            exit 1
          fi
          # Cloudflare auto-publishes HTTPS/SVCB records for proxied hosts; the
          # docs say so, and the README must not contradict them.
          if grep -n 'alpn="h3,h2"' README.md; then
            echo "README contradicts deployment.md §17: HTTPS records are published by Cloudflare, not maintained by hand"
            exit 1
          fi
      - name: Check shell scripts
        run: |
          bash -n deploy/*.sh scripts/*.sh
          # bash -n only parses. shellcheck is what catches the quoting and
          # errexit gaps that turn a partial failure into a silent success.
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning -e SC1091 deploy/*.sh scripts/*.sh
      - name: Check Python syntax
        run: python -m py_compile scripts/subset_fonts.py && rm -rf scripts/__pycache__

  plugin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install regcode test dependencies
        working-directory: plugin-swpu-regcode
        run: npm ci --no-audit --no-fund
      - name: Run regcode tests
        working-directory: plugin-swpu-regcode
        run: npm test
      - name: Install train test dependencies
        working-directory: plugin-swpu-train
        run: npm ci --no-audit --no-fund
      - name: Run train plugin tests
        working-directory: plugin-swpu-train
        run: npm test
      - name: Run ops plugin tests
        run: node --test plugin-swpu-ops/tests/*.test.cjs
      - name: Install shop test dependencies
        working-directory: plugin-swpu-shop
        run: npm ci --no-audit --no-fund
      - name: Run shop plugin tests
        run: node --test plugin-swpu-shop/tests/*.test.cjs
      - name: Run deployment script tests
        run: node --test scripts/deployment.test.mjs scripts/landing.test.cjs
